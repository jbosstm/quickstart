# The participant runs on 8081 so it can coexist with the coordinator on 8080.
quarkus.http.port=8081

# Narayana LRA client: where to reach the coordinator.
# Default (if unset) is http://localhost:8080/lra-coordinator.
lra.coordinator.url=http://localhost:8080/lra-coordinator

# MicroProfile JWT verification.
# This application publishes its own public key as a JWKS at /auth/jwks, standing in for an
# external identity provider's discovery endpoint. The RSA key pair is generated in memory at
# startup, so the location is fetched lazily on the first request that carries a token.
# NOTE: the host:port below must match quarkus.http.port above.
mp.jwt.verify.publickey.location=http://localhost:8081/auth/jwks
mp.jwt.verify.issuer=https://demo.narayana.io

# ---- Securing the inbound LRA callbacks (opt-in; default open) ----
# The complete/compensate callbacks are invoked by the coordinator, not the end user. By
# default they stay open (policy 'permit'), matching the coordinator's own opt-in design.
# Enforce with -Dparticipant.callback.auth.policy=authenticated so only a coordinator that
# presents a valid token (its service token, or the propagated caller token) can drive them.
quarkus.http.auth.permission.lra-callbacks.paths=/inventory/complete,/inventory/compensate,/payment/complete,/payment/compensate
quarkus.http.auth.permission.lra-callbacks.policy=${participant.callback.auth.policy:permit}

# Let the LRA runtime own its framework classes instead of Arc managing them as CDI beans
# (same workaround as the cdi-participant example).
quarkus.arc.exclude-types=io.narayana.lra.filter.ServerLRAFilter,io.narayana.lra.client.internal.proxy.nonjaxrs.LRAParticipantResource
